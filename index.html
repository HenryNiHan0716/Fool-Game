<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 粒子交互手势游戏 - 能量爆发版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f8f8f8; font-family: 'Inter', sans-serif; }
        #video-container { position: absolute; bottom: 20px; left: 20px; width: 180px; height: 135px; border-radius: 12px; overflow: hidden; border: 3px solid rgba(0,0,0,0.1); transform: scaleX(-1); z-index: 50; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #video-feed { width: 100%; height: 100%; object-fit: cover; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
        
        /* 状态面板 */
        .status-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        /* 进度条通用样式 */
        .bar-wrapper {
            position: relative;
            width: 100%;
            height: 24px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            transition: width 0.3s ease-out;
        }

        #energy-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
        
        .bar-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        #score-display {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 32px;
            font-weight: 900;
            color: #333;
            text-align: right;
        }

        /* 爆发模式滤镜 */
        #overdrive-overlay {
            position: fixed;
            inset: 0;
            border: 0px solid rgba(255, 215, 0, 0.6);
            pointer-events: none;
            z-index: 90;
            transition: border-width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overdrive-active #overdrive-overlay {
            border-width: 20px;
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.4); display: none; z-index: 100; pointer-events: none; }
        
        #game-over {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
        }

        .shield-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 45;
        }
        #shield-left { border: 6px solid rgba(0, 119, 255, 0.9); background: radial-gradient(circle, rgba(0, 119, 255, 0) 40%, rgba(0, 119, 255, 0.3) 100%); }
        #shield-right { border: 6px solid rgba(255, 50, 0, 0.9); background: radial-gradient(circle, rgba(255, 50, 0, 0) 40%, rgba(255, 50, 0, 0.3) 100%); }

        #loading-screen { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .load-indicator { width: 240px; height: 6px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
        #load-bar { height: 100%; background: #0077ff; width: 0%; transition: width 0.3s; }
        
        .feedback-text {
            position: absolute;
            font-weight: 900;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 60;
            animation: float-up 0.8s ease-out forwards;
        }
        @keyframes float-up {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -100%) scale(1.4); opacity: 1; }
            100% { transform: translate(-50%, -200%) scale(1); opacity: 0; }
        }
        
        /* 改进的音频提示 */
        #audio-hint { 
            position: fixed; 
            top: 120px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: bold; 
            background: #ff4757; 
            padding: 12px 30px; 
            border-radius: 30px; 
            z-index: 200; 
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }
        #audio-hint.ready {
            background: #2ecc71;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
            transform: translateX(-50%) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }
    </style>
</head>
<body>

    <div id="overdrive-overlay"></div>

    <div id="loading-screen">
        <div class="mb-6 text-2xl font-black tracking-tight uppercase text-blue-600">Shield System</div>
        <div class="load-indicator"><div id="load-bar"></div></div>
        <div id="load-status" class="mt-4 text-sm text-gray-400 font-medium">初始化交互界面...</div>
    </div>

    <div id="audio-hint" onclick="initAudio()">点击此处激活音频系统 (BGM)</div>
    
    <div id="damage-overlay"></div>

    <div id="game-over">
        <h1 class="text-6xl font-black mb-4">游戏结束</h1>
        <p id="final-score" class="text-2xl mb-8">最终得分: 0</p>
        <button onclick="resetGame()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full font-bold transition-all transform hover:scale-105 pointer-events-auto">重试</button>
    </div>

    <div id="score-display">0</div>

    <div class="ui-overlay" id="ui-root">
        <div class="status-panel">
            <div class="bar-wrapper">
                <div id="health-bar"></div>
                <div class="bar-label">生命值: <span id="health-val">100</span>%</div>
            </div>
            <div class="bar-wrapper">
                <div id="energy-bar"></div>
                <div class="bar-label">能量爆发: <span id="energy-val">0</span>%</div>
            </div>
        </div>
        
        <div id="shield-left" class="shield-ring"></div>
        <div id="shield-right" class="shield-ring"></div>
        
        <div class="absolute bottom-10 right-10 text-right bg-white/80 p-4 rounded-xl text-xs space-y-1">
            <div>🔥 <span class="text-orange-600 font-bold">完美格挡</span>：积攒能量</div>
            <div>⚡ <span class="text-blue-600 font-bold">能量爆发</span>：无敌状态 + 3倍分数</div>
        </div>
    </div>

    <div id="video-container"><video id="video-feed" playsinline></video></div>

    <script>
        // --- 核心音频引擎 ---
        let audioCtx, masterGain;
        let isAudioStarted = false;
        let bgmInterval = null;

        async function initAudio() {
            if (isAudioStarted) return;
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // 强制恢复挂起的上下文
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);
                
                isAudioStarted = true;
                
                // 更新UI反馈
                const hint = document.getElementById('audio-hint');
                hint.innerText = "音频已就绪！";
                hint.classList.add('ready');
                
                console.log("音频引擎状态:", audioCtx.state);
                
                // 启动背景音乐循环
                startBGM();
                
                // 播放一个成功的启动音效
                playPowerUpSound();
            } catch (err) {
                console.error("音频初始化失败:", err);
            }
        }

        function playBlockSound(multiplier = 1) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = multiplier > 1 ? 'sawtooth' : 'sine';
            osc.frequency.setValueAtTime(440 * multiplier, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880 * multiplier, audioCtx.currentTime + 0.1);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(g);
            g.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playHitSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.3);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(g);
            g.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playPowerUpSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.6);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(g);
            g.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // C-E-G-C-G-E
            let step = 0;
            
            const playTick = () => {
                if (isGameOver || !isAudioStarted || audioCtx.state !== 'running') return;
                
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                
                // 爆发模式下音调变高，波形变犀利
                osc.type = isOverdrive ? 'sawtooth' : 'triangle';
                const freq = isOverdrive ? notes[step % notes.length] : notes[step % notes.length] / 2;
                
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.05, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (isOverdrive ? 0.2 : 0.4));
                
                osc.connect(g);
                g.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                
                step++;
                // 爆发模式下节奏加快
                setTimeout(playTick, isOverdrive ? 200 : 400);
            };
            
            playTick();
        }

        // --- 游戏逻辑 ---
        let scene, camera, renderer, clock;
        let enemyProjectiles = []; 
        let shieldStates = { BLUE: false, RED: false };
        let handWorldPos = { BLUE: new THREE.Vector3(), RED: new THREE.Vector3() };
        let handScreenPos = { BLUE: {x:0, y:0}, RED: {x:0, y:0} };
        
        let health = 100;
        let energy = 0;
        let score = 0;
        let isOverdrive = false;
        let isGameOver = false;

        const healthBar = document.getElementById('health-bar');
        const energyBar = document.getElementById('energy-bar');
        const scoreDisplay = document.getElementById('score-display');
        const videoElement = document.getElementById('video-feed');
        const gameOverScreen = document.getElementById('game-over');

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.fog = new THREE.Fog(0xffffff, 10, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
            const light = new THREE.DirectionalLight(0xffffff, 0.5);
            light.position.set(0, 20, 10);
            scene.add(light);

            const grid = new THREE.GridHelper(200, 50, 0xcccccc, 0xeeeeee);
            scene.add(grid);

            setInterval(() => {
                if(!isGameOver) spawnEnemyProjectile();
            }, 1500);
            
            window.addEventListener('resize', onWindowResize);
            // 鼠标点击作为音频激活兜底
            window.addEventListener('mousedown', initAudio);
            animate();
        }

        function spawnEnemyProjectile() {
            const isRed = Math.random() > 0.5;
            const color = isRed ? 0xff4757 : 0x2e86de;
            const projectile = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 16, 16),
                new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.4 })
            );
            projectile.position.set((Math.random() - 0.5) * 25, (Math.random() - 0.5) * 12 + 3, -80);
            projectile.userData = { 
                type: isRed ? 'RED' : 'BLUE',
                speed: isOverdrive ? 0.5 : 0.3,
                direction: new THREE.Vector3(0, 1.6, 15).sub(projectile.position).normalize()
            };
            scene.add(projectile);
            enemyProjectiles.push(projectile);
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(results => {
            if (isGameOver) return;
            shieldStates.BLUE = false; shieldStates.RED = false;
            document.getElementById('shield-left').style.display = 'none';
            document.getElementById('shield-right').style.display = 'none';

            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label; 
                    const wrist = landmarks[0];
                    const screenX = (1 - wrist.x) * window.innerWidth;
                    const screenY = wrist.y * window.innerHeight;
                    const worldX = (0.5 - wrist.x) * 40; 
                    const worldY = (0.5 - wrist.y) * 24 + 3; 

                    if (label === 'Right') { 
                        shieldStates.BLUE = true;
                        handWorldPos.BLUE.set(worldX, worldY, 14.3);
                        handScreenPos.BLUE = {x: screenX, y: screenY};
                        updateShieldUI(document.getElementById('shield-left'), screenX, screenY);
                    } else { 
                        shieldStates.RED = true;
                        handWorldPos.RED.set(worldX, worldY, 14.3);
                        handScreenPos.RED = {x: screenX, y: screenY};
                        updateShieldUI(document.getElementById('shield-right'), screenX, screenY);
                    }
                });
            }
        });

        function updateShieldUI(el, x, y) {
            el.style.display = 'block';
            el.style.left = x + 'px'; el.style.top = y + 'px';
        }

        function showFeedback(text, x, y, colorClass) {
            const div = document.createElement('div');
            div.className = `feedback-text ${colorClass} text-4xl`;
            div.style.left = x + 'px'; div.style.top = y + 'px';
            div.innerText = text;
            document.getElementById('ui-root').appendChild(div);
            setTimeout(() => div.remove(), 800);
        }

        function triggerDamage() {
            if (isGameOver) return;
            if (isOverdrive) {
                showFeedback("免疫伤害", window.innerWidth/2, window.innerHeight/2, "text-blue-400");
                return;
            }
            
            health -= 25;
            energy = 0; 
            updateUI();
            playHitSound();
            
            document.getElementById('damage-overlay').style.display = 'block';
            setTimeout(() => { document.getElementById('damage-overlay').style.display = 'none'; }, 150);

            if (health <= 0) endGame();
        }

        function handleSuccessfulBlock(screenPos) {
            const gain = isOverdrive ? 300 : 100;
            score += gain;
            
            if (!isOverdrive) {
                energy += 10;
                if (energy >= 100) startOverdrive();
            }
            
            playBlockSound(isOverdrive ? 1.8 : 1);
            showFeedback(isOverdrive ? "爆发得分! +300" : "完美格挡! +100", screenPos.x, screenPos.y, isOverdrive ? "text-yellow-400 font-black" : "text-green-500");
            updateUI();
        }

        function startOverdrive() {
            energy = 100;
            isOverdrive = true;
            document.body.classList.add('overdrive-active');
            playPowerUpSound();
            
            setTimeout(() => {
                isOverdrive = false;
                energy = 0;
                document.body.classList.remove('overdrive-active');
                updateUI();
            }, 10000); 
        }

        function updateUI() {
            healthBar.style.width = Math.max(0, health) + "%";
            document.getElementById('health-val').innerText = Math.max(0, health);
            energyBar.style.width = energy + "%";
            document.getElementById('energy-val').innerText = energy;
            scoreDisplay.innerText = score;
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = 'flex';
            document.getElementById('final-score').innerText = `最终得分: ${score}`;
        }

        function resetGame() {
            health = 100; energy = 0; score = 0;
            isGameOver = false; isOverdrive = false;
            document.body.classList.remove('overdrive-active');
            updateUI();
            gameOverScreen.style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 自动尝试恢复挂起的音频（用户交互后有效）
            if (isAudioStarted && audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isGameOver) {
                renderer.render(scene, camera);
                return;
            }
            
            enemyProjectiles.forEach((p, index) => {
                p.position.add(p.userData.direction.clone().multiplyScalar(p.userData.speed));
                
                // 判定区检测
                if (p.position.z > 14.0 && p.position.z < 15.2) {
                    const type = p.userData.type;
                    let isBlocked = false;
                    let sPos = {x: window.innerWidth/2, y: window.innerHeight/2};

                    if (type === 'BLUE' && shieldStates.BLUE) {
                        if (p.position.distanceTo(handWorldPos.BLUE) < 4.5) { isBlocked = true; sPos = handScreenPos.BLUE; }
                    } else if (type === 'RED' && shieldStates.RED) {
                        if (p.position.distanceTo(handWorldPos.RED) < 4.5) { isBlocked = true; sPos = handScreenPos.RED; }
                    }

                    if (isBlocked) {
                        handleSuccessfulBlock(sPos);
                        createImpact(p.position, type === 'RED' ? 0xff4757 : 0x2e86de);
                        scene.remove(p);
                        enemyProjectiles.splice(index, 1);
                    }
                }

                // 漏球检测
                if (p.position.z > 16.5) {
                    triggerDamage();
                    scene.remove(p);
                    enemyProjectiles.splice(index, 1);
                }
            });

            renderer.render(scene, camera);
        }

        function createImpact(pos, color) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(2.5, 0.1, 16, 32),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
            );
            ring.position.copy(pos); ring.lookAt(camera.position);
            scene.add(ring);
            let s = 1.0;
            const ani = () => {
                s += 0.5; ring.scale.set(s, s, s); ring.material.opacity -= 0.1;
                if(ring.material.opacity > 0) requestAnimationFrame(ani);
                else scene.remove(ring);
            };
            ani();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        async function start() {
            try {
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 640, height: 480
                });
                document.getElementById('load-bar').style.width = "50%";
                await cameraUtils.start();
                document.getElementById('load-bar').style.width = "100%";
                setTimeout(() => {
                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 500);
                    initScene();
                }, 500);
            } catch (e) {
                document.getElementById('load-status').innerText = "摄像头不可用";
            }
        }

        window.onload = start;
    </script>
</body>
</html>
